# INACTIVE COPY. The gh OAuth token used for the first push lacks the workflow
# scope, so GitHub rejects any commit that adds .github/workflows/ci.yml.
# Fix, then move this file back:
#   gh auth refresh -h github.com -s workflow
#   mkdir .github\workflows
#   move docs\ci.yml .github\workflows\ci.yml
#   git add .github/workflows/ci.yml
#   git commit -m "Add CI"
#   git push

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        working-directory: service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        working-directory: service
        run: python -m pytest -q

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check index.js
          node --check client.js
          node --check extras/desktop/lib/index.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Manifest / locale parse
        run: |
          python - <<'PY'
          import json, tomllib
          for path in ["package.json", "locale/zh.json", "locale/en.json", "extras/desktop/package.json"]:
              json.load(open(path, encoding="utf-8"))
          tomllib.load(open("service/pyproject.toml", "rb"))
          print("manifests ok")
          PY
